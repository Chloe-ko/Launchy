app-id: io.github.chloe_ko.Launchy
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: launchy

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Native Steam: read game/proton data; write compat tool registration dir
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.local/share/Steam/compatibilitytools.d:create
  - --filesystem=~/.steam:ro
  # Flatpak Steam: read game/proton data; write compat tool registration dir
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/compatibilitytools.d:create
  # Launchy config and the extracted compat tool runner binary
  - --filesystem=xdg-config/launchy:create
  - --filesystem=xdg-data/launchy:create

modules:
  - name: launchy
    buildsystem: simple
    # pip3 install requires network. Build with:
    #   flatpak-builder --user --install --force-clean build-dir io.github.chloe_ko.Launchy.yml
    # and ensure the build sandbox has network access (flatpak-builder --disable-cache or
    # set build-args: [--share=network] below if your flatpak-builder version supports it).
    # For Flathub submission, replace the pip install of pyinstaller with
    # pre-downloaded wheels declared as type: file sources.
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Install PyInstaller for the runner build step
      - pip3 install pyinstaller pyinstaller-hooks-contrib
      # Install the Flatpak GUI/settings command
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      # Build the standalone compat tool runner bundle
      - pyinstaller --clean --noconfirm launchy.spec
      # Embed the runner in the Flatpak so launchy install can copy it out
      - install -Dm755 dist/launchy-runner /app/share/launchy/runner
    sources:
      - type: dir
        path: .
