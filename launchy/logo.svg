<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Pixel-art anime heart — 13×11 grid, pixel size 32, centered in 512×512
    Colors: #FFFFFF gloss | #FFB3D1 highlight | #FF3399 main | #CC0066 shadow
    x_offset=48  y_offset=80   col→x=48+col*32   row→y=80+row*32
  -->

  <!-- White gloss (shine on top-left of left bump) -->
  <g fill="#FFFFFF">
    <rect x="112" y="80"  width="32" height="32"/>
    <rect x="112" y="112" width="32" height="32"/>
  </g>

  <!-- Highlight — light pink -->
  <g fill="#FFB3D1">
    <rect x="144" y="80"  width="32" height="32"/>
    <rect x="80"  y="112" width="32" height="32"/>
    <rect x="144" y="112" width="32" height="32"/>
    <rect x="48"  y="144" width="32" height="32"/>
    <rect x="80"  y="144" width="32" height="32"/>
    <rect x="112" y="144" width="32" height="32"/>
    <rect x="48"  y="176" width="32" height="32"/>
    <rect x="80"  y="176" width="32" height="32"/>
  </g>

  <!-- Main — vibrant anime pink -->
  <g fill="#FF3399">
    <!-- row 0 -->
    <rect x="176" y="80"  width="32" height="32"/>
    <rect x="304" y="80"  width="32" height="32"/>
    <rect x="336" y="80"  width="32" height="32"/>
    <rect x="368" y="80"  width="32" height="32"/>
    <!-- row 1 -->
    <rect x="176" y="112" width="32" height="32"/>
    <rect x="208" y="112" width="32" height="32"/>
    <rect x="272" y="112" width="32" height="32"/>
    <rect x="304" y="112" width="32" height="32"/>
    <rect x="336" y="112" width="32" height="32"/>
    <rect x="368" y="112" width="32" height="32"/>
    <rect x="400" y="112" width="32" height="32"/>
    <!-- row 2 -->
    <rect x="144" y="144" width="32" height="32"/>
    <rect x="176" y="144" width="32" height="32"/>
    <rect x="208" y="144" width="32" height="32"/>
    <rect x="240" y="144" width="32" height="32"/>
    <rect x="272" y="144" width="32" height="32"/>
    <rect x="304" y="144" width="32" height="32"/>
    <rect x="336" y="144" width="32" height="32"/>
    <rect x="368" y="144" width="32" height="32"/>
    <rect x="400" y="144" width="32" height="32"/>
    <rect x="432" y="144" width="32" height="32"/>
    <!-- row 3 -->
    <rect x="112" y="176" width="32" height="32"/>
    <rect x="144" y="176" width="32" height="32"/>
    <rect x="176" y="176" width="32" height="32"/>
    <rect x="208" y="176" width="32" height="32"/>
    <rect x="240" y="176" width="32" height="32"/>
    <rect x="272" y="176" width="32" height="32"/>
    <rect x="304" y="176" width="32" height="32"/>
    <rect x="336" y="176" width="32" height="32"/>
    <rect x="368" y="176" width="32" height="32"/>
    <rect x="400" y="176" width="32" height="32"/>
    <rect x="432" y="176" width="32" height="32"/>
    <!-- row 4 -->
    <rect x="48"  y="208" width="32" height="32"/>
    <rect x="80"  y="208" width="32" height="32"/>
    <rect x="112" y="208" width="32" height="32"/>
    <rect x="144" y="208" width="32" height="32"/>
    <rect x="176" y="208" width="32" height="32"/>
    <rect x="208" y="208" width="32" height="32"/>
    <rect x="240" y="208" width="32" height="32"/>
    <rect x="272" y="208" width="32" height="32"/>
    <rect x="304" y="208" width="32" height="32"/>
    <rect x="336" y="208" width="32" height="32"/>
    <rect x="368" y="208" width="32" height="32"/>
    <!-- row 5 -->
    <rect x="80"  y="240" width="32" height="32"/>
    <rect x="112" y="240" width="32" height="32"/>
    <rect x="144" y="240" width="32" height="32"/>
    <rect x="176" y="240" width="32" height="32"/>
    <rect x="208" y="240" width="32" height="32"/>
    <rect x="240" y="240" width="32" height="32"/>
    <rect x="272" y="240" width="32" height="32"/>
    <rect x="304" y="240" width="32" height="32"/>
    <!-- row 6 -->
    <rect x="112" y="272" width="32" height="32"/>
    <rect x="144" y="272" width="32" height="32"/>
    <rect x="176" y="272" width="32" height="32"/>
    <rect x="208" y="272" width="32" height="32"/>
    <rect x="240" y="272" width="32" height="32"/>
    <rect x="272" y="272" width="32" height="32"/>
    <!-- row 7 -->
    <rect x="144" y="304" width="32" height="32"/>
    <rect x="176" y="304" width="32" height="32"/>
    <rect x="208" y="304" width="32" height="32"/>
    <rect x="240" y="304" width="32" height="32"/>
    <!-- row 8 -->
    <rect x="176" y="336" width="32" height="32"/>
    <rect x="208" y="336" width="32" height="32"/>
    <rect x="240" y="336" width="32" height="32"/>
    <!-- row 9 -->
    <rect x="208" y="368" width="32" height="32"/>
  </g>

  <!-- Shadow — deep pink, bottom-right diagonal -->
  <g fill="#CC0066">
    <!-- row 4 -->
    <rect x="400" y="208" width="32" height="32"/>
    <rect x="432" y="208" width="32" height="32"/>
    <!-- row 5 -->
    <rect x="336" y="240" width="32" height="32"/>
    <rect x="368" y="240" width="32" height="32"/>
    <rect x="400" y="240" width="32" height="32"/>
    <!-- row 6 -->
    <rect x="304" y="272" width="32" height="32"/>
    <rect x="336" y="272" width="32" height="32"/>
    <rect x="368" y="272" width="32" height="32"/>
    <!-- row 7 -->
    <rect x="272" y="304" width="32" height="32"/>
    <rect x="304" y="304" width="32" height="32"/>
    <rect x="336" y="304" width="32" height="32"/>
    <!-- row 8 -->
    <rect x="272" y="336" width="32" height="32"/>
    <rect x="304" y="336" width="32" height="32"/>
    <!-- row 9 -->
    <rect x="240" y="368" width="32" height="32"/>
    <rect x="272" y="368" width="32" height="32"/>
    <!-- row 10 — tip -->
    <rect x="240" y="400" width="32" height="32"/>
  </g>
</svg>
